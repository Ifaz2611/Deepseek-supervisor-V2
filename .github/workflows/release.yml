name: Release

# Builds the extension and publishes a GitHub Release with the zip + SHA-256
# checksum whenever a version tag (e.g. v1.0.1) is pushed.
# Can also be run manually (Actions tab → Release → Run workflow) as a
# build-only dry run — assets are attached to the workflow run instead.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build & publish extension zip
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using tag: $TAG"

      - name: Verify tag matches package version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "${{ steps.tag.outputs.tag }}" ]; then
            echo "::error::Tag ${{ steps.tag.outputs.tag }} does not match version $VERSION from package.json."
            echo "::error::Run 'npm run version:set -- <version>' and re-tag."
            exit 1
          fi
          echo "Tag ${{ steps.tag.outputs.tag }} matches package.json"

      - name: Build & package (zip + checksum)
        run: npm run release

      - name: Verify bundle contents
        run: |
          echo "dist/ contents:"
          ls -la dist
          echo "releases/ contents:"
          ls -la releases
          test -f dist/manifest.json
          test -f dist/content.js
          test -f dist/content.css
          test -f dist/background.js
          test -f dist/injected.js
          test -f dist/icon16.png
          test -f dist/icon48.png
          test -f dist/icon128.png

      - name: Upload build artifacts (always, for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-supervisor-release-assets
          path: |
            releases/*.zip
            releases/*.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ASSETS="releases/*.zip releases/*.sha256"
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets (clobber)."
            gh release upload "$TAG" --repo "$REPO" --clobber $ASSETS
          else
            echo "Creating release $TAG."
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "DeepSeek Supervisor $TAG" \
              --generate-notes \
              --verify-tag \
              $ASSETS
          fi
